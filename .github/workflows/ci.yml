name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Contract tests (HR-1..HR-15)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pre-commit greps (HR-13, L10, HR-10 lite)
        run: |
          bash bin/check_no_todo.sh
          bash bin/check_no_skip_in_contract.sh
          bash bin/check_no_silent_except.sh
      - name: Contract suite
        run: |
          pytest -m contract -v
      - name: Per-feature suite
        run: |
          pytest -m feature -v
      - name: Coverage gate
        run: |
          pytest --cov=runaway_context --cov-fail-under=85 -q

  clean_install:
    name: Clean install (HR-15)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fresh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Clean-install end-to-end
        run: |
          pytest tests/contract/test_hr_15_clean_install_works.py -v

  docker_clean_install:
    name: Clean install in Docker (HR-15)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t runaway-context-ci .
      - name: Run clean-install script
        run: docker run --rm runaway-context-ci

  plan_status:
    name: Plan status (HR-11) — release gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contract, clean_install, docker_clean_install]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          RC_RELEASE_GATE: "1"
        run: |
          python -m pip install -e ".[dev]"
          pytest tests/contract/test_hr_11_plan_status_complete.py -v
