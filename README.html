<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RunawayContext v3 — README preview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 0;
      background: #f6f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .preview-banner {
      background: #fff8c5;
      border-bottom: 1px solid #d4a72c;
      padding: 8px 16px;
      font-size: 13px;
      color: #59470d;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .preview-banner code {
      background: #fff;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 12px;
    }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 24px 64px;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
    }
    .markdown-body {
      padding: 32px;
      box-sizing: border-box;
      max-width: 100%;
    }
    /* Mermaid diagrams get a soft GitHub-like card */
    .mermaid {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 16px;
      margin: 16px 0;
      text-align: center;
      overflow-x: auto;
    }
    /* Make details blocks more obviously expandable */
    details {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 8px 16px;
      margin: 8px 0;
    }
    details summary {
      cursor: pointer;
      font-weight: 600;
      padding: 4px 0;
    }
    details[open] summary {
      margin-bottom: 8px;
      border-bottom: 1px solid #d0d7de;
    }
    @media (max-width: 768px) {
      .container { margin: 0; border: none; border-radius: 0; }
      .markdown-body { padding: 16px; }
    }
    .loading { padding: 64px; text-align: center; color: #57606a; }
  </style>
</head>
<body>
  <div class="preview-banner">
    <strong>Local preview</strong> of <code>README.md</code> — this is approximately how GitHub will render it after you push.
    Mermaid diagrams render via <code>mermaid.js</code>; styling via <code>github-markdown-css</code>.
    Source file: <code>/var/www/html/_sMs/RunawayContext_v3/README.md</code>
  </div>
  <div class="container">
    <article class="markdown-body" id="content">
      <div class="loading">Loading README.md …</div>
    </article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

    async function render() {
      try {
        const url = 'README.md?ts=' + Date.now();
        const resp = await fetch(url, { cache: 'no-store' });
        if (!resp.ok) throw new Error('failed to fetch README.md (status ' + resp.status + ')');
        const raw = await resp.text();

        // Configure marked to NOT process the mermaid fenced blocks — we render them ourselves.
        marked.use({
          gfm: true,
          breaks: false,
          renderer: {
            code(code, lang) {
              if (lang === 'mermaid') {
                return '<div class="mermaid">' + code + '</div>';
              }
              const highlighted = (window.hljs && hljs.getLanguage(lang))
                ? hljs.highlight(code, { language: lang }).value
                : (window.hljs ? hljs.highlightAuto(code).value : code);
              return '<pre><code class="hljs language-' + (lang || '') + '">' + highlighted + '</code></pre>';
            }
          }
        });

        const html = marked.parse(raw);
        document.getElementById('content').innerHTML = html;

        // Run mermaid against the rendered blocks.
        await mermaid.run({ querySelector: '.mermaid' });

        // Apply highlight.js to remaining code blocks.
        if (window.hljs) {
          document.querySelectorAll('pre code').forEach((el) => {
            try { hljs.highlightElement(el); } catch (e) { /* ignore */ }
          });
        }
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<h1>Preview failed</h1><pre>' + (err && err.message ? err.message : err) + '</pre>';
      }
    }

    render();
  </script>
</body>
</html>
